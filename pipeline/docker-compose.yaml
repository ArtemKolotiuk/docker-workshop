version: "3.9"

services:
  pgdatabase:
    image: postgres:18
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: ny_taxi
    volumes:
      - ny_taxi_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: root
    ports:
      - "8085:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    restart: unless-stopped

  pipeline:
    build: .
    depends_on:
      - pgdatabase
    environment:
      PG_HOST: pgdatabase
      PG_PORT: 5432
      PG_USER: root
      PG_PASSWORD: root
      PG_DB: ny_taxi
    command: [ "7" ] # <-- day argument for your script
    restart: "no"

volumes:
  ny_taxi_postgres_data:
  pgadmin_data:
